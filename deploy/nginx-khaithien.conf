# Nginx reverse proxy cho Khải Thiên v3 (chạy sau docker-compose, port 3000)
# Script deploy.sh sẽ thay __DOMAIN__ bằng tên miền thật.
# Certbot (Let's Encrypt) tự thêm block SSL sau khi cấp cert.

server {
    listen 80;
    server_name __DOMAIN__;

    # ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Chuyển hướng toàn bộ sang container web (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
